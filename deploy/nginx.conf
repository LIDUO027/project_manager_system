# 项目管理系统 · 待办清单 — Nginx 反向代理
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pms-todo
#   sudo ln -s /etc/nginx/sites-available/pms-todo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   * 前端静态页由后端一并提供（/ 与 /css /js 都代理到 uvicorn），
#     所以这里只需一条 proxy_pass —— 前端与 API 同源，无跨域问题。
#     若要由 Nginx 直接托管静态文件，见文件末尾的注释。
#   * 把 pms.example.com 换成你自己的域名 / 公网 IP。

server {
    listen 80;
    listen [::]:80;
    server_name pms.example.com;

    # --- 申请 HTTPS 证书时用（certbot 会自动改写本段）---
    # location /.well-known/acme-challenge/ { root /var/www/html; }

    # 上传/请求体上限（当前无上传功能，留个合理值即可）
    client_max_body_size 4m;

    # 访问日志
    access_log /var/log/nginx/pms-todo.access.log;
    error_log  /var/log/nginx/pms-todo.error.log;

    # --- 安全响应头 ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API 与页面：统一代理到 FastAPI ---
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # --- 健康检查不写日志 ---
    location = /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # --- 静态资源加长缓存（文件名不带 hash，故用 1 天并允许协商缓存）---
    location ~* ^/(css|js)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- 简单限流（可选）：防止接口被刷 ---
    # limit_req_zone $binary_remote_addr zone=pmsapi:10m rate=10r/s;  # 需放在 http{} 里
    # location /api/ {
    #     limit_req zone=pmsapi burst=20 nodelay;
    #     proxy_pass http://127.0.0.1:8000;
    # }

    # --- 如需 Basic Auth（内网小工具常见做法）---
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd youruser
    # 然后取消下面两行注释：
    # auth_basic           "PMS Todo";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}

